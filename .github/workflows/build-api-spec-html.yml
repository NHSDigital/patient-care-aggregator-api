name: Build API Spec HTML Docs

on:
  pull_request:
    branches:
      - master
    paths:
      - 'specification/**'
  workflow_dispatch:

jobs:
  generate-api-docs:
    name: Generate API Specs HTML Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: short-sha
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint API specs
        run: npm run lint

      - name: Publish bundled API specs
        run: npm run publish

      - name: Dereference bundled API specs
        run: |
          set -euo pipefail

          deref_spec() {
            local input_path="$1"
            local output_path="$2"

            echo "Dereferencing $input_path"
            if ! npx --yes @apidevtools/swagger-cli@4.0.4 bundle "$input_path" -o "$output_path" --dereference; then
              echo "::error::Failed to dereference $input_path"
              exit 1
            fi
          }

          deref_spec "build/patient-care-aggregator-api-consumer-api.json" "build/patient-care-aggregator-api-consumer-api.deref.json"
          deref_spec "build/patient-care-aggregator-api-producer-api-standards.json" "build/patient-care-aggregator-api-producer-api-standards.deref.json"
          deref_spec "build/patient-care-aggregator-api-record-service-api.json" "build/patient-care-aggregator-api-record-service-api.deref.json"
 
      - name: Generate static HTML docs
        run: |
          set -euo pipefail

          OUTPUT_DIR="build/api-docs"
          mkdir -p "$OUTPUT_DIR"

          generate_doc() {
            local spec_path="$1"
            local output_file="$2"

            echo "Generating docs for $spec_path"
            if ! npx --yes @redocly/cli@1.25.13 build-docs "$spec_path" -o "$output_file"; then
              echo "::error::Failed to generate docs for $spec_path"
              exit 1
            fi
          }

          generate_doc "build/patient-care-aggregator-api-consumer-api.deref.json" "$OUTPUT_DIR/consumer-api.html"
          generate_doc "build/patient-care-aggregator-api-producer-api-standards.deref.json" "$OUTPUT_DIR/producer-api-standards.html"
          generate_doc "build/patient-care-aggregator-api-record-service-api.deref.json" "$OUTPUT_DIR/record-service-api.html"


      - name: Upload API docs artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-specs-html-docs-${{ steps.short-sha.outputs.value }}
          path: build/api-docs
          if-no-files-found: error

      - name: Comment on PR with artifact links
        if: github.event_name == 'pull_request'
        uses: unsplash/comment-on-pr@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          msg: |
            ## API Spec HTML Docs

            Built from commit `${{ steps.short-sha.outputs.value }}` — [view workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Download HTML API Specs:** [api-specs-html-docs-${{ steps.short-sha.outputs.value }}.zip](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-artifact.outputs.artifact-id }})