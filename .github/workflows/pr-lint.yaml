name: PR Quality Check
on: pull_request
jobs:
  link-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Check ticket name conforms to requirements
        run: |
          PR_REF=${{ github.event.pull_request.head.ref }}
          VALID_TICKET=$(echo "$PR_REF" | grep -i -E -o '(wpp-[0-9]+)' | tr '[:lower:]' '[:upper:]')
          if [ -z  "$VALID_TICKET" ]; then
            echo "TICKET_NAME=$VALID_TICKET" >> "$GITHUB_ENV"
          echo "$PR_REF" | grep -i -E -q "(dependabot\/)"; then
            echo "DEPENDABOT PR - NO JIRA TICKET REQUIRED"
          else
            echo "MISSING_JIRA_TICKET=true" >> "$GITHUB_ENV"
          fi

      - name: Check for Existing Jira Ticket Comments
        id: find-comments
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const ticketNumberCommentIds = comments.data.filter(comment => comment.body.find('<!-- Jira Ticket: Ticket Info -->')).map(c => c.id);
            const warningCommentIds = comments.data.filter(comment => comment.body.find('<!-- Jira Ticket: Warning -->')).map(c => c.id);

            core.setOutput('ticket-number-comment-ids', JSON.stringify(ticketNumberCommentIds));
            core.setOutput('warning-comment-ids', JSON.stringify(warningCommentIds));

      - name: Comment on PR with Warning
        if: env.MISSING_JIRA_TICKET == true && fromJSON(steps.find-comments.warning-comment-ids).length < 1
        uses: actions/github-script@v7
        with:
          script: |
            const message = `
            <!-- Jira Ticket: Warning -->
            ⚠️ This branch is missing its Jira Ticket number.
            Please rename the branch to include it.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });

            // fail workflow early when warning comment is posted
            core.setFailed('No Jira ticket number found in branch name');

      - name: Comment on PR with link to JIRA ticket
        if: env.TICKET_NAME != '' && fromJSON(steps.find-comments.ticket-number-comment-ids).length < 1
        uses: actions/github-script@v7
        with:
          script: |
            const ticket = process.env.TICKET_NAME;
            const message = `
            <!-- Jira Ticket: Ticket Info -->
            This branch is work on a ticket in the NHS Digital WPP JIRA Project. Here's a handy link to the ticket:
            # [${ticket}](https://nhsd-jira.digital.nhs.uk/browse/${ticket})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });

      - name: Remove Unnecessary Warning Comments
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            }).data;

            const warningComments = comments.filter(comment => comment.body.find('<!-- Jira Ticket: Warning -->'));
            const ticketComments = comments.filter(comment => comment.body.find('<!-- Jira Ticket: Ticket Info -->'));

            if (warningComments.length > 0 && ticketComments > 0) {
              // PR now has a ticket number in its branch name, and a corresponding comment
              // so remove any previous warning comments
              for (warning in warningComments) {
                await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: warning.id
                });
              }
            }

            if (ticketComments > 1) {
              // PR has more than one comment relating to the Jira ticket number
              // so remove all but the most recent one
              const commentsToDelete = ticketComments.slice(0, -1);

              for (const comment of commentsToDelete) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id
                });
              }
            }
