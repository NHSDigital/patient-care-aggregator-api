name: PR Quality Check
on: pull_request
jobs:
  link-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Check ticket name conforms to requirements
        run: |
          PR_REF=${{ github.event.pull_request.head.ref }}
          VALID_TICKET=$(echo "$PR_REF" | grep -i -E -o '(wpp-[0-9]+)' | tr '[:lower:]' '[:upper:]')
          if [ -z  "$VALID_TICKET" ]; then
            echo "TICKET_NAME=$VALID_TICKET" >> "$GITHUB_ENV"
          else
            # dependabot branches are also valid, but won't have Jira ticket numbers
            echo "$PR_REF" | grep -i -E -q "(dependabot\/)"
          fi

      - name: Comment on PR with link to JIRA ticket
        if: env.TICKET_NAME != ''
        uses: actions/github-script@v7
        with:
          script: |
            const ticket = process.env.TICKET_NAME;
            const message = `
            This branch is work on a ticket in the NHS Digital WPP JIRA Project. Here's a handy link to the ticket:
            # [${ticket}](https://nhsd-jira.digital.nhs.uk/browse/${ticket})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });
