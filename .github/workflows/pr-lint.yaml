name: PR Quality Check
on: pull_request
jobs:
  link-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        id: validate
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          ALLOWED_BRANCH_REGEX: '^(feat|feature|chore|spike|bugfix)\/[A-Z][A-Z0-9]+-[0-9]+(-[a-zA-Z0-9]+)*$|^(release|hotfix|revert|dependabot)\/.+$'
        run: |
          if [[ "$BRANCH_NAME" =~ $ALLOWED_BRANCH_REGEX ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Jira ticket
        id: jira
        if: ${{ steps.validate.outputs.passed == 'true' }}
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          TICKET_REGEX: ([Ww][Pp][Pp]-[0-9]+)
        run: |
          if [[ "$BRANCH_NAME" =~ $TICKET_REGEX ]]; then
            TICKET="${BASH_REMATCH[1]^^}"  # convert matched ticket to uppercase
            echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"
          else
            echo "ticket='" >> "$GITHUB_OUTPUT"
          fi

      - name: Manage PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
          PASSED: ${{ steps.validate.outputs.passed }}
          REASON: ${{ steps.validate.outputs.reason }}
          JIRA_TICKET: ${{ steps.jira.outputs.ticket }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then exit 0; fi
          
          MARKER="<!-- pr-lint-marker -->"
          
          # create a Jira ticket link to add to the comment when one matching the regex is present in the branch name
          if (( ! "$BRANCH_NAME" == '' )); then
            JIRA_LINK="Jira ticket: [${JIRA_TICKET}](https://nhsd-jira.digital.nhs.uk/browse/${JIRA_TICKET})"
          else
            JIRA_LINK=""
          fi
          
          if [[ "$PASSED" == "true" ]]; then
            read -r -d '' BODY <<EOF || true
            ${MARKER}
            
            ## ✅ Branch Name Validation Passed
            
            \`\`\`
            ${BRANCH_NAME}
            \`\`\`
            
            ${JIRA_LINK}
            EOF
          else
            read -r -d '' BODY <<EOF || true
            ${MARKER}
            
            ## ❌ Branch Name Validation Failed
            
            Branch format is invalid.
            
            Expected format: \`<prefix>/<JIRA-key>-<kebab-description>\`
            
            Ensure JIRA ticket key is included. Allowed prefixes: feat, feature, chore, spike, hotfix, bugfix, release, revert
            
            \`\`\`
            ${BRANCH_NAME}
            \`\`\`
            EOF
          fi
          
          # Find and delete existing comment with marker
          COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)
          if [[ -n "$COMMENT_ID" ]]; then
            gh api -X DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          fi

          # Post new comment
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Fail if validation failed
        if: steps.validate.outputs.passed == 'false'
        shell: bash
        run: exit 1      
